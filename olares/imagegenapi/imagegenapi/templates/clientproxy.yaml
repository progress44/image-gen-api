---
apiVersion: v1
kind: ConfigMap
metadata:
  name: imagegenapi-nginx-config
  namespace: {{ .Release.Namespace }}
data:
  nginx.conf: |
    server {
      listen {{ .Values.proxy.port }};
      access_log /opt/bitnami/openresty/nginx/logs/access.log;
      error_log /opt/bitnami/openresty/nginx/logs/error.log;

      proxy_connect_timeout 60s;
      proxy_send_timeout 900s;
      proxy_read_timeout 900s;
      proxy_http_version 1.1;

      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header Cookie $http_cookie;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";

      location / {
        resolver coredns.kube-system.svc.cluster.local valid=10s;
        proxy_pass http://{{ .Values.proxy.backendHost }}:{{ .Values.proxy.backendPort }};
        proxy_next_upstream error timeout http_500 http_502 http_503 http_504;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS, HEAD" always;
        add_header Access-Control-Allow-Headers "authorization,content-type,x-csrftoken,deviceType,token" always;

        if ($request_method = 'OPTIONS') {
          return 204;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: imagegenapi-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: imagegenapi-web
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: imagegenapi-web
    spec:
      volumes:
        - name: imagegenapi-nginx-config
          configMap:
            name: imagegenapi-nginx-config
            items:
              - key: nginx.conf
                path: nginx.conf
      containers:
        - name: nginx
          image: {{ .Values.proxy.image | quote }}
          ports:
            - containerPort: {{ .Values.proxy.port }}
              protocol: TCP
          env:
            - name: OPENRESTY_CONF_FILE
              value: /etc/nginx/nginx.conf
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - |
                  http_code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:{{ .Values.proxy.port }}/health)
                  [ $http_code -ge 200 ] && [ $http_code -lt 500 ]
            initialDelaySeconds: 2
            timeoutSeconds: 3
            periodSeconds: 3
            successThreshold: 1
            failureThreshold: 60
          resources:
            limits:
              cpu: 100m
              memory: 256Mi
            requests:
              cpu: 10m
              memory: 64Mi
          volumeMounts:
            - name: imagegenapi-nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: imagegenapi-nginx-config
              mountPath: /opt/bitnami/openresty/nginx/conf/server_blocks/nginx.conf
              subPath: nginx.conf
---
apiVersion: v1
kind: Service
metadata:
  name: imagegenapi-web-svc
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app: imagegenapi-web
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.proxy.port }}
      targetPort: {{ .Values.proxy.port }}
